# SPEC: FR-030, FR-031, FR-033, SC-013, SPEC-007 Task 3
# Staging beta release. Design: specs/008-cloud-beta-deployment/cloud-beta-design.md section 4.
# A run from anything other than a v* tag only verifies. Nothing deploys while the repository variable
# CLOUD_DEPLOYMENT_READY is not "true". This workflow never targets GA production.
name: Cloud Run release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

env:
  # NFR-LIC-03. Changing this needs a human image review: see "Curriculum pin" in README.md.
  INGEST_PINNED_SHA: 392d0df1b2647cbee104942390551f1ed9e072c8

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check Go dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Generate lessons at the pinned commit
        run: go run ./cmd/ingest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check lessons and images
        run: go run ./cmd/ingest -verify
      - run: npm ci
        working-directory: web
      - name: Check runtime npm dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test --project=chromium
        working-directory: web

  # The contract on Google's emulator. It does not mimic production transactions, so staging still has
  # to prove concurrency (T120).
  store-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta,cloud-firestore-emulator
      - name: Run the Store contract on the Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8085 --quiet &
          for _ in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8085 && break; sleep 1; done
          FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 go test -count=1 -v -run 'OnEmulator' ./internal/state/

  build:
    needs: [verify, store-emulator]
    if: startsWith(github.ref, 'refs/tags/v') && vars.CLOUD_DEPLOYMENT_READY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
      asset: ${{ steps.content.outputs.asset }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit count is the build number
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate lessons at the pinned commit
        id: content
        run: |
          go run ./cmd/ingest
          go run ./cmd/ingest -verify
          echo "asset=$(ls public-content/assets | head -n 1)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
      - name: Work out the image name and build stamp
        id: name
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          {
            echo "image=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/coach"
            echo "number=$(git rev-list --count HEAD)"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(git show -s --format=%cs HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push the release image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true # T119: an SBOM is stored with the image
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          build-args: |
            RELEASE_TAG=${{ github.ref_name }}
            BUILD_NUMBER=${{ steps.name.outputs.number }}
            BUILD_COMMIT=${{ steps.name.outputs.commit }}
            BUILD_DATE=${{ steps.name.outputs.date }}

  candidate:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      revision: ${{ steps.deploy.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy the digest with no traffic
        id: deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          ASSET: ${{ needs.build.outputs.asset }}
          RELEASE: ${{ github.ref_name }}
          GCP_SERVICE: ${{ vars.GCP_SERVICE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          tag="rc-$(echo "$RELEASE" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed 's/-*$//')"
          gcloud run deploy "$GCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --no-traffic --tag "$tag" --quiet
          status="$(gcloud run services describe "$GCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          url="$(echo "$status" | jq -r --arg t "$tag" '.status.traffic[] | select(.tag == $t) | .url')"
          revision="$(echo "$status" | jq -r --arg t "$tag" '.status.traffic[] | select(.tag == $t) | .revisionName')"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          ./deploy/scripts/smoke.sh "$url" "$RELEASE" "$ASSET"

  # The reviewer sits on this environment only, so a rollback never waits for approval.
  promote:
    needs: [build, candidate]
    runs-on: ubuntu-latest
    environment: staging-promote
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Move beta traffic, check it, and roll back on failure
        env:
          REVISION: ${{ needs.candidate.outputs.revision }}
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          ASSET: ${{ needs.build.outputs.asset }}
          RELEASE: ${{ github.ref_name }}
          GCP_SERVICE: ${{ vars.GCP_SERVICE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          args=(--project "$GCP_PROJECT_ID" --region "$GCP_REGION")
          status="$(gcloud run services describe "$GCP_SERVICE" "${args[@]}" --format=json)"
          previous="$(echo "$status" | jq -r '[.status.traffic[] | select(.percent == 100)][0].revisionName // ""')"
          url="$(echo "$status" | jq -r '.status.url')"
          gcloud run services update-traffic "$GCP_SERVICE" "${args[@]}" --to-revisions "$REVISION=100" --quiet
          if ! ./deploy/scripts/smoke.sh "$url" "$RELEASE" "$ASSET"; then
            if [ -n "$previous" ]; then
              gcloud run services update-traffic "$GCP_SERVICE" "${args[@]}" --to-revisions "$previous=100" --quiet
              echo "Rolled back to $previous" >&2
            fi
            exit 1
          fi
          {
            echo "### Staging release $RELEASE"
            echo "- URL: $url"
            echo "- Image: \`$IMAGE\`"
            echo "- Revision: \`$REVISION\`"
            if [ -n "$previous" ]; then
              echo "- Rollback: \`gh workflow run rollback.yml --ref $RELEASE -f revision=$previous\`"
            else
              echo "- Rollback: none, this is the first release"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

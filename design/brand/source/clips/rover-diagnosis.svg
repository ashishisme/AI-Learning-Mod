<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <style>
    .s { display: none }
    .s:target { display: inline }
    .card { fill: #FFFFFF; stroke: #475569; stroke-width: 1.5 }
    .new { fill: #DBEAFE; stroke: #1D4ED8; stroke-width: 2.5 }
    .ln { stroke: #334155; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round }
    .rule { fill: #1D4ED8 }
    .off { fill: #E2E8F0; stroke: #64748B; stroke-width: 1.5 }
    .n { font: 700 11px system-ui, sans-serif; fill: #FFFFFF; text-anchor: middle }
    .no { font: 700 11px system-ui, sans-serif; fill: #334155; text-anchor: middle }
    .x { font: 700 14px system-ui, sans-serif; fill: #B91C1C; text-anchor: middle }
    .pop { transform-box: fill-box; transform-origin: center }
    .s:target .in { animation: show 0.8s ease-out 1 both }
    .s:target .pop { animation: pop 0.7s ease-out 0.7s 1 both }
    .s:target .glow { animation: glow 1.4s ease-in-out 0.2s 1 both }
    @keyframes show { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pop { 0% { transform: scale(0.4); opacity: 0 } 70% { transform: scale(1.15); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
    @keyframes glow { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <!-- sensor facts: dusty panels, daytime, battery low, dish misaligned -->
    <g id="facts">
      <rect class="card" x="14" y="11" width="40" height="30" rx="7"/>
      <rect x="22" y="18" width="24" height="16" rx="2" fill="#1D4ED8"/>
      <path d="M30 18 V34 M38 18 V34 M22 26 H46" stroke="#FFFFFF" stroke-width="1"/>
      <g fill="#E7C9A0" stroke="#92400E"><circle cx="26" cy="22" r="2.2"/><circle cx="35" cy="29" r="2.4"/><circle cx="42" cy="21" r="2"/><circle cx="28" cy="31" r="1.8"/><circle cx="41" cy="31" r="1.8"/></g>
      <rect class="card" x="14" y="51" width="40" height="30" rx="7"/>
      <circle cx="34" cy="66" r="6" fill="#FACC15" stroke="#B45309" stroke-width="1.5"/>
      <path d="M34 55 v3 M34 74 v3 M23 66 h3 M42 66 h3 M26 58 l2 2 M40 72 l2 2 M42 58 l-2 2 M26 74 l2 -2" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
      <rect class="card" x="14" y="91" width="40" height="30" rx="7"/>
      <rect x="23" y="100" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
      <rect x="43" y="103" width="3" height="6" fill="#334155"/><rect x="25" y="102" width="5" height="8" fill="#B91C1C"/>
      <rect class="card" x="14" y="131" width="40" height="30" rx="7"/>
      <g transform="rotate(-40 34 144)"><path d="M24 142 a10 10 0 0 0 20 0z" fill="#64748B"/><path d="M34 142 v-7" stroke="#334155" stroke-width="2"/></g>
      <path d="M34 148 v8 M28 156 h12" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- pass 1: rule 1 gives power degraded, rule 3 gives communication lost -->
    <g id="p1l">
      <path class="ln" d="M54 26 L84 46 M54 66 L84 46 M92 46 H99 M94 42 l5 4 l-5 4 M54 146 H99 M94 142 l5 4 l-5 4"/>
      <circle class="rule" cx="84" cy="46" r="8"/><text class="n" x="84" y="50">1</text>
      <circle class="rule" cx="77" cy="146" r="8"/><text class="n" x="77" y="150">3</text>
    </g>
    <g id="power">
      <path d="M122 35 l-8 12 h6 l-3 10 l9 -13 h-6 l3 -9z" fill="#F59E0B" stroke="#92400E" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M131 40 v11 M127 47 l4 4 l4 -4" stroke="#B91C1C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="comm">
      <circle cx="115" cy="152" r="2.5" fill="#334155"/>
      <path d="M111 147 a6 6 0 0 1 8 0 M107 143 a11 11 0 0 1 16 0" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text class="x" x="131" y="152">✗</text>
    </g>
    <!-- pass 2: rule 2 gives safe mode -->
    <g id="p2l">
      <path class="ln" d="M140 46 L164 78 M54 106 L164 78 M172 78 H179 M174 74 l5 4 l-5 4"/>
      <circle class="rule" cx="164" cy="78" r="8"/><text class="n" x="164" y="82">2</text>
    </g>
    <path id="safe" d="M200 66 l10 4 v7 c0 6 -4 10 -10 13 c-6 -3 -10 -7 -10 -13 v-7z" fill="#047857"/>
    <!-- pass 3: rule 4 gives emergency halt -->
    <g id="p3l">
      <path class="ln" d="M220 78 L244 113 M140 146 L244 113 M252 113 H261 M256 109 l5 4 l-5 4"/>
      <circle class="rule" cx="244" cy="113" r="8"/><text class="n" x="244" y="117">4</text>
    </g>
    <g id="halt"><path d="M277 102 h10 l7 7 v8 l-7 7 h-10 l-7 -7 v-8z" fill="#B91C1C"/><rect x="275" y="111" width="14" height="4" rx="1" fill="#FFFFFF"/></g>
  </defs>
  <rect width="320" height="180" rx="16" fill="#FFFBEB"/>

  <!-- 1: the four sensor facts -->
  <g id="s1" class="s">
    <g class="in"><use href="#facts"/></g>
  </g>

  <!-- 2: pass 1, rules 1 and 3 fire -->
  <g id="s2" class="s">
    <use href="#facts"/>
    <g class="in"><use href="#p1l"/></g>
    <g class="pop"><rect class="new" x="100" y="31" width="40" height="30" rx="7"/><use href="#power"/></g>
    <g class="pop"><rect class="new" x="100" y="131" width="40" height="30" rx="7"/><use href="#comm"/></g>
  </g>

  <!-- 3: pass 2, rule 2 fires -->
  <g id="s3" class="s">
    <use href="#facts"/><use href="#p1l"/>
    <rect class="card" x="100" y="31" width="40" height="30" rx="7"/><use href="#power"/>
    <rect class="card" x="100" y="131" width="40" height="30" rx="7"/><use href="#comm"/>
    <g class="in"><use href="#p2l"/></g>
    <g class="pop"><rect class="new" x="180" y="63" width="40" height="30" rx="7"/><use href="#safe"/></g>
  </g>

  <!-- 4: pass 3, rule 4 fires -->
  <g id="s4" class="s">
    <use href="#facts"/><use href="#p1l"/><use href="#p2l"/>
    <rect class="card" x="100" y="31" width="40" height="30" rx="7"/><use href="#power"/>
    <rect class="card" x="100" y="131" width="40" height="30" rx="7"/><use href="#comm"/>
    <rect class="card" x="180" y="63" width="40" height="30" rx="7"/><use href="#safe"/>
    <g class="in"><use href="#p3l"/></g>
    <g class="pop"><rect class="new" x="262" y="98" width="40" height="30" rx="7"/><use href="#halt"/></g>
  </g>

  <!-- 5: pass 4, nothing new; rules 5 and 6 never fire -->
  <g id="s5" class="s">
    <use href="#facts"/><use href="#p1l"/><use href="#p2l"/><use href="#p3l"/>
    <rect class="card" x="100" y="31" width="40" height="30" rx="7"/><use href="#power"/>
    <rect class="card" x="100" y="131" width="40" height="30" rx="7"/><use href="#comm"/>
    <rect class="card" x="180" y="63" width="40" height="30" rx="7"/><use href="#safe"/>
    <g class="glow"><rect class="new" x="262" y="98" width="40" height="30" rx="7"/><use href="#halt"/></g>
    <g class="in">
      <circle class="off" cx="244" cy="30" r="8"/><text class="no" x="244" y="34">5</text><text class="x" x="260" y="35">✗</text>
      <circle class="off" cx="280" cy="30" r="8"/><text class="no" x="280" y="34">6</text><text class="x" x="296" y="35">✗</text>
    </g>
  </g>
</svg>

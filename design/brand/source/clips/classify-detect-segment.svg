<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <style>
    .s { display: none }
    .s:target { display: inline }
    .whole { fill: none; stroke: #1D4ED8; stroke-width: 4 }
    .tag { fill: #DBEAFE; stroke: #1D4ED8; stroke-width: 2.5 }
    .box { fill: none; stroke: #1D4ED8; stroke-width: 2.5 }
    .bike { fill: none; stroke: #C2410C; stroke-width: 2.5 }
    .pop { transform-box: fill-box; transform-origin: center }
    .s:target .in { animation: show 0.8s ease-out 1 both }
    .s:target .pop { animation: pop 0.6s ease-out 1 both }
    .s:target .d1 { animation-delay: 0.3s }
    .s:target .d2 { animation-delay: 0.6s }
    .s:target .d3 { animation-delay: 0.9s }
    .s:target .slide { animation: slide 0.8s ease-out 0.4s 1 both }
    .s:target .wipe { animation: wipe 1.6s ease-out 1 both }
    @keyframes show { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pop { 0% { transform: scale(0.5); opacity: 0 } 70% { transform: scale(1.1); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
    @keyframes slide { from { transform: translateX(-20px); opacity: 0 } to { transform: none; opacity: 1 } }
    @keyframes wipe { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <g id="car"><rect x="-10" y="-15" width="18" height="8" rx="3"/><rect x="-18" y="-8" width="36" height="12" rx="4"/></g>
    <g id="wheels"><circle cx="-10" cy="5" r="4.5"/><circle cx="10" cy="5" r="4.5"/></g>
    <g id="rider" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-9" cy="0" r="6.5" fill="none"/><circle cx="9" cy="0" r="6.5" fill="none"/>
      <path d="M-9 0 L-3 -11 L7 -11 L9 0 M-3 -11 L0 0 L7 -11 M-3 -12 L2 -24 L7 -12 M-3 -12 L0 -1" fill="none"/>
      <circle cx="4" cy="-29" r="4.5" stroke="none"/>
    </g>
    <g id="scene">
      <rect x="60" y="18" width="180" height="144" fill="#E0F2FE"/>
      <circle cx="214" cy="40" r="10" fill="#FACC15"/>
      <rect x="60" y="64" width="180" height="70" fill="#94A3B8"/>
      <path d="M64 99 H236" stroke="#F8FAFC" stroke-width="2.5" stroke-dasharray="12 9"/>
      <rect x="60" y="134" width="180" height="28" fill="#E7E5E4"/>
      <path d="M100 134 V162 M140 134 V162 M180 134 V162 M220 134 V162" stroke="#A8A29E" stroke-width="1.5"/>
      <use href="#car" x="92" y="88" fill="#DC2626"/>
      <use href="#car" x="186" y="88" fill="#F8FAFC"/>
      <use href="#car" x="128" y="120" fill="#FACC15"/>
      <use href="#wheels" x="92" y="88" fill="#0F172A"/><use href="#wheels" x="186" y="88" fill="#0F172A"/><use href="#wheels" x="128" y="120" fill="#0F172A"/>
      <use href="#rider" x="206" y="124" stroke="#0F172A" fill="#0F172A"/>
    </g>
    <pattern id="px" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M6 0 V6 H0" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7"/></pattern>
  </defs>
  <rect width="320" height="180" rx="16" fill="#FFFBEB"/>

  <!-- 1: one street picture: three cars and a cyclist on a road, with pavement below -->
  <g id="s1" class="s">
    <g class="in"><use href="#scene"/></g>
  </g>

  <!-- 2: classification: one label for the whole picture -->
  <g id="s2" class="s">
    <use href="#scene"/>
    <rect class="whole pop" x="58" y="16" width="184" height="148"/>
    <g class="slide">
      <path d="M242 90 H254" stroke="#1D4ED8" stroke-width="2.5"/>
      <path class="tag" d="M254 90 L266 74 H306 V106 H266 Z"/>
      <circle cx="265" cy="90" r="3" fill="#FFFBEB" stroke="#1D4ED8" stroke-width="1.5"/>
      <path d="M276 102 L284 78 M300 102 L292 78" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M288 80 V101" stroke="#334155" stroke-width="2" stroke-dasharray="4 3"/>
    </g>
  </g>

  <!-- 3: detection: a box around each car and the cyclist -->
  <g id="s3" class="s">
    <use href="#scene"/>
    <rect class="box pop" x="71" y="70" width="42" height="26" rx="2"/>
    <rect class="box pop d1" x="165" y="70" width="42" height="26" rx="2"/>
    <rect class="box pop d2" x="107" y="102" width="42" height="26" rx="2"/>
    <rect class="bike pop d3" x="188" y="88" width="36" height="45" rx="2"/>
  </g>

  <!-- 4: segmentation: every pixel coloured by what it belongs to -->
  <g id="s4" class="s">
    <use href="#scene"/>
    <g class="wipe">
      <rect x="60" y="18" width="180" height="46" fill="#BAE6FD"/>
      <rect x="60" y="64" width="180" height="70" fill="#C4B5FD"/>
      <rect x="60" y="134" width="180" height="28" fill="#86EFAC"/>
      <use href="#car" x="92" y="88" fill="#FB923C"/><use href="#wheels" x="92" y="88" fill="#FB923C"/>
      <use href="#car" x="186" y="88" fill="#FB923C"/><use href="#wheels" x="186" y="88" fill="#FB923C"/>
      <use href="#car" x="128" y="120" fill="#FB923C"/><use href="#wheels" x="128" y="120" fill="#FB923C"/>
      <use href="#rider" x="206" y="124" stroke="#DB2777" fill="#DB2777"/>
      <rect x="60" y="18" width="180" height="144" fill="url(#px)"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <style>
    .s { display: none }
    .s:target { display: inline }
    .ax { stroke: #94A3B8; stroke-width: 1.5 }
    .va { stroke: #1D4ED8; stroke-width: 3.5; stroke-linecap: round }
    .vb { stroke: #C2410C; stroke-width: 3.5; stroke-linecap: round }
    .tip { font: 600 11px system-ui, sans-serif; fill: #0F172A }
    .m { font: 600 13px system-ui, sans-serif; fill: #0F172A; text-anchor: middle }
    .big { font: 700 24px system-ui, sans-serif; fill: #0F172A; text-anchor: middle }
    .fr { font: 700 15px system-ui, sans-serif; fill: #0F172A; text-anchor: middle }
    .ex { font: 700 15px system-ui, sans-serif; fill: #0F172A }
    .track { fill: #E2E8F0 }
    .bar { fill: #1D4ED8 }
    .arrow { stroke: #334155; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round }
    .grow { transform-box: fill-box; transform-origin: left center }
    .vec { transform-origin: 60px 100px }
    .pp { transform-box: fill-box; transform-origin: center }
    .s:target .in { animation: show 0.8s ease-out 1 both }
    .s:target .in2 { animation: show 0.8s ease-out 0.8s 1 both }
    .s:target .vec { animation: vec 1s ease-out 1 both }
    .s:target .grow { animation: grow 1.4s ease-out 0.3s 1 both }
    .s:target .pop { animation: pop 0.6s ease-out 1.1s 1 both }
    @keyframes show { from { opacity: 0 } to { opacity: 1 } }
    @keyframes vec { from { transform: scale(0) } to { transform: none } }
    @keyframes grow { from { transform: scaleX(0) } to { transform: none } }
    @keyframes pop { 0% { transform: scale(0.4); opacity: 0 } 70% { transform: scale(1.15); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <marker id="ha" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1D4ED8"/></marker>
    <marker id="hb" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#C2410C"/></marker>
    <!-- axes: origin at (60, 100), 16 px per unit -->
    <g id="axes"><path class="ax" d="M20 100 H160 M60 18 V172"/></g>
    <!-- word icons: a plain word chip, a cat, a dog, a chair (sat), speed lines (ran) -->
    <g id="w"><rect x="-14" y="-10" width="28" height="20" rx="5" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><path d="M-7 0 h14" stroke="#64748B" stroke-width="4" stroke-linecap="round"/></g>
    <g id="cat"><path d="M-9 -3 L-8 -14 L-1 -8 Z M9 -3 L8 -14 L1 -8 Z" fill="#334155"/><circle r="9" fill="#334155"/><circle cx="-3.5" cy="-1" r="1.8" fill="#FFFFFF"/><circle cx="3.5" cy="-1" r="1.8" fill="#FFFFFF"/></g>
    <g id="dog"><circle r="9" fill="#B45309"/><ellipse cx="-9" cy="1" rx="3.5" ry="7" fill="#78350F"/><ellipse cx="9" cy="1" rx="3.5" ry="7" fill="#78350F"/><circle cx="-3.5" cy="-2" r="1.8" fill="#FFFFFF"/><circle cx="3.5" cy="-2" r="1.8" fill="#FFFFFF"/><circle cy="4" r="2.2" fill="#0F172A"/></g>
    <g id="sat"><path d="M-6 -11 V9 M-6 1 H7 V9" stroke="#334155" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="ran"><path d="M-11 -6 H1 M-7 0 H5 M-11 6 H1 M5 -7 L11 0 L5 7" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="ok"><circle r="10" fill="#047857"/><path d="M-5 0 l3.5 3.5 l6 -7" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="no"><circle r="10" fill="#B91C1C"/><path d="M-4 -4 l8 8 M4 -4 l-8 8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/></g>
  </defs>
  <rect width="320" height="180" rx="16" fill="#FFFBEB"/>

  <!-- 1: (3, 4) and (4, 3) almost overlap: 24 ÷ (5 × 5) = 0.96 -->
  <g id="s1" class="s">
    <use href="#axes"/>
    <g class="vec"><path class="va" d="M60 100 L106 39" marker-end="url(#ha)"/><path class="vb" d="M60 100 L121 54" marker-end="url(#hb)"/></g>
    <g class="in2"><text x="104" y="27" class="tip" text-anchor="middle">(3, 4)</text><text x="128" y="52" class="tip">(4, 3)</text></g>
    <g class="in">
      <text x="248" y="58" class="m">3 × 4 + 4 × 3 = 24</text>
      <text x="248" y="88" class="m">24 ÷ (5 × 5)</text>
    </g>
    <text x="248" y="128" class="big in2">= 0.96</text>
  </g>

  <!-- 2: (3, 4) and (4, −3) meet at a right angle: 12 − 12 = 0 -->
  <g id="s2" class="s">
    <use href="#axes"/>
    <path class="va" d="M60 100 L106 39" marker-end="url(#ha)"/>
    <g class="vec"><path class="vb" d="M60 100 L121 146" marker-end="url(#hb)"/></g>
    <text x="104" y="27" class="tip" text-anchor="middle">(3, 4)</text>
    <g class="in2"><text x="128" y="156" class="tip">(4, −3)</text><path d="M66 92 L74 98 L68 106" stroke="#0F172A" stroke-width="2" fill="none"/></g>
    <text x="248" y="80" class="m in">12 − 12 = 0</text>
    <text x="248" y="122" class="big in2">0</text>
  </g>

  <!-- 3: after the first word: cat 2/3, dog 1/3 -->
  <g id="s3" class="s">
    <use href="#w" x="34" y="90"/>
    <path class="arrow" d="M54 84 L90 64 M54 96 L90 116"/>
    <use href="#cat" x="108" y="62"/><use href="#dog" x="108" y="118"/>
    <rect class="track" x="128" y="54" width="150" height="16" rx="8"/><rect class="track" x="128" y="110" width="150" height="16" rx="8"/>
    <rect class="bar grow" x="128" y="54" width="100" height="16" rx="8"/><rect class="bar grow" x="128" y="110" width="50" height="16" rx="8"/>
    <g class="in2"><text x="298" y="67" class="fr">2/3</text><text x="298" y="123" class="fr">1/3</text></g>
  </g>

  <!-- 4: after cat: sat 1/2, ran 1/2 -->
  <g id="s4" class="s">
    <use href="#cat" x="34" y="90"/>
    <path class="arrow" d="M54 84 L90 64 M54 96 L90 116"/>
    <use href="#sat" x="108" y="62"/><use href="#ran" x="108" y="118"/>
    <rect class="track" x="128" y="54" width="150" height="16" rx="8"/><rect class="track" x="128" y="110" width="150" height="16" rx="8"/>
    <rect class="bar grow" x="128" y="54" width="75" height="16" rx="8"/><rect class="bar grow" x="128" y="110" width="75" height="16" rx="8"/>
    <g class="in2"><text x="298" y="67" class="fr">1/2</text><text x="298" y="123" class="fr">1/2</text></g>
  </g>

  <!-- 5: cat sat: 2/3 × 1/2 = 1/3; dog ran: 1/3 × 0 = 0 -->
  <g id="s5" class="s">
    <g class="in">
      <rect x="14" y="38" width="284" height="44" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
      <use href="#w" x="38" y="60"/><use href="#cat" x="70" y="61"/><use href="#sat" x="98" y="60"/>
      <text x="122" y="65" class="ex">2/3 × 1/2 = 1/3</text>
    </g>
    <g class="in2">
      <rect x="14" y="102" width="284" height="44" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
      <use href="#w" x="38" y="124"/><use href="#dog" x="70" y="124"/><use href="#ran" x="100" y="124"/>
      <text x="122" y="129" class="ex">1/3 × 0 = 0</text>
    </g>
    <g class="pp pop"><use href="#ok" x="276" y="60"/></g>
    <g class="pp pop"><use href="#no" x="276" y="124"/></g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="thinkBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="thinkScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="thinkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Glowing Idea Spark Above Antenna -->
  <path d="M 60 4 L 62 10 L 68 12 L 62 14 L 60 20 L 58 14 L 52 12 L 58 10 Z" fill="#F59E0B" />

  <!-- Antenna -->
  <rect x="57" y="20" width="6" height="14" rx="3" fill="#64748B" />
  <circle cx="60" cy="18" r="6" fill="#F59E0B" />
  <circle cx="60" cy="18" r="3" fill="#FDE68A" />

  <!-- Ears -->
  <rect x="24" y="50" width="6" height="16" rx="3" fill="#94A3B8" />
  <rect x="90" y="50" width="6" height="16" rx="3" fill="#94A3B8" />

  <!-- Head Chassis -->
  <rect x="30" y="30" width="60" height="56" rx="16" fill="url(#thinkBody)" stroke="#0284C7" stroke-width="2" />

  <!-- Screen -->
  <rect x="38" y="40" width="44" height="34" rx="10" fill="url(#thinkScreen)" />

  <!-- Curious Looking-Up Eyes -->
  <circle cx="50" cy="51" r="4.5" fill="url(#thinkGlow)" />
  <circle cx="51.5" cy="49" r="1.5" fill="#FFFFFF" />
  <circle cx="68" cy="51" r="4.5" fill="url(#thinkGlow)" />
  <circle cx="69.5" cy="49" r="1.5" fill="#FFFFFF" />

  <!-- Curious O-Mouth -->
  <circle cx="59" cy="64" r="3" stroke="#38BDF8" stroke-width="2" fill="none" />

  <!-- Pondering Hand on Chin -->
  <g transform="translate(68, 76)">
    <rect x="0" y="0" width="10" height="20" rx="5" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="5" cy="0" r="5" fill="#0284C7" />
  </g>
</svg>

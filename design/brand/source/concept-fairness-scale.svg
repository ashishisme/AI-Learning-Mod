<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Equal Balance Scale -->
  <rect x="10" y="10" width="80" height="80" rx="16" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
  <!-- Central Pillar -->
  <line x1="50" y1="36" x2="50" y2="76" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <rect x="36" y="74" width="28" height="6" rx="3" fill="#334155"/>
  <circle cx="50" cy="36" r="4" fill="#F59E0B"/>
  <!-- Level Beam -->
  <line x1="26" y1="36" x2="74" y2="36" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
  <!-- Pans with Equal Stars -->
  <path d="M 22 56 Q 30 62 38 56 Z" fill="#38BDF8"/>

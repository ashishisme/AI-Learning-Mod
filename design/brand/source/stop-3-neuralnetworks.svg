<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="synapseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bgGrad3)" stroke="#C7D2FE" stroke-width="2"/>

  <!-- Network Interconnection Synapses -->
  <line x1="42" y1="52" x2="80" y2="40" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="52" x2="80" y2="80" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="108" x2="80" y2="80" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="108" x2="80" y2="120" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="40" x2="120" y2="60" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="120" y2="60" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="120" y2="100" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="120" x2="120" y2="100" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>

  <!-- Input Nodes Layer -->
  <circle cx="42" cy="52" r="11" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
  <circle cx="42" cy="108" r="11" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>

  <!-- Hidden Nodes Layer -->
  <circle cx="80" cy="40" r="12" fill="#6366F1" stroke="#4338CA" stroke-width="2"/>
  <circle cx="80" cy="80" r="14" fill="#A855F7" stroke="#7E22CE" stroke-width="2"/>
  <circle cx="80" cy="120" r="12" fill="#6366F1" stroke="#4338CA" stroke-width="2"/>

  <!-- Output Nodes Layer -->
  <circle cx="120" cy="60" r="13" fill="#EC4899" stroke="#BE185D" stroke-width="2"/>
  <circle cx="120" cy="100" r="13" fill="#10B981" stroke="#047857" stroke-width="2"/>

  <!-- Glowing Pulse on Winning Output Node -->
  <circle cx="120" cy="100" r="6" fill="#A7F3D0"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="cheerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cheerScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cheerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Celebration Confetti / Stars -->
  <path d="M 22 18 L 24 22 L 28 24 L 24 26 L 22 30 L 20 26 L 16 24 L 20 22 Z" fill="#F59E0B" />
  <path d="M 98 18 L 100 22 L 104 24 L 100 26 L 98 30 L 96 26 L 92 24 L 96 22 Z" fill="#EC4899" />
  <circle cx="36" cy="12" r="3" fill="#10B981" />
  <circle cx="84" cy="12" r="3" fill="#38BDF8" />

  <!-- Antenna -->
  <rect x="57" y="20" width="6" height="14" rx="3" fill="#64748B" />
  <circle cx="60" cy="18" r="6" fill="#F59E0B" />
  <circle cx="60" cy="18" r="3" fill="#FDE68A" />

  <!-- Ears -->
  <rect x="24" y="50" width="6" height="16" rx="3" fill="#94A3B8" />
  <rect x="90" y="50" width="6" height="16" rx="3" fill="#94A3B8" />

  <!-- Both Arms Raised in Joy -->
  <g transform="translate(14, 30) rotate(-35)">
    <rect x="0" y="0" width="10" height="26" rx="5" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="5" cy="0" r="5" fill="#0284C7" />
  </g>
  <g transform="translate(96, 24) rotate(35)">
    <rect x="0" y="0" width="10" height="26" rx="5" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="5" cy="0" r="5" fill="#0284C7" />
  </g>

  <!-- Head Chassis -->
  <rect x="30" y="30" width="60" height="56" rx="16" fill="url(#cheerBody)" stroke="#0284C7" stroke-width="2" />

  <!-- Screen -->
  <rect x="38" y="40" width="44" height="34" rx="10" fill="url(#cheerScreen)" />

  <!-- Happy Curved Eyes ^_^ -->
  <path d="M 46 54 Q 52 46 58 54" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 62 54 Q 68 46 74 54" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Big Cheerful Smile -->
  <path d="M 50 63 Q 60 72 70 63 Z" fill="#38BDF8" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- 3x3 Pixel Convolution Feature Grid -->
  <rect x="10" y="10" width="80" height="80" rx="16" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="2"/>
  <!-- 3x3 Tiles -->
  <rect x="22" y="22" width="16" height="16" rx="4" fill="#0284C7"/>
  <rect x="42" y="22" width="16" height="16" rx="4" fill="#0284C7"/>
  <rect x="62" y="22" width="16" height="16" rx="4" fill="#0284C7"/>
  <rect x="22" y="42" width="16" height="16" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="42" y="42" width="16" height="16" rx="4" fill="#38BDF8"/>
  <rect x="62" y="42" width="16" height="16" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="22" y="62" width="16" height="16" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="42" y="62" width="16" height="16" rx="4" fill="#0284C7"/>
  <rect x="62" y="62" width="16" height="16" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <!-- Focus Scanner Border -->
  <rect x="18" y="18" width="64" height="64" rx="8" stroke="#EC4899" stroke-width="2" stroke-dasharray="4 2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
  <rect x="2" y="2" width="316" height="176" rx="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
  <path d="M20 156 H300" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <!-- easy friend: a low bar, says yes quickly -->
  <rect x="34" y="132" width="100" height="8" rx="4" fill="#10B981"/>
  <g>
    <path d="M84 156 v-34" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    <rect x="64" y="84" width="40" height="44" rx="16" fill="#10B981"/>
    <circle cx="84" cy="66" r="18" fill="#FDBA74" stroke="#C2410C" stroke-width="2"/>
    <circle cx="78" cy="64" r="2.5" fill="#334155"/><circle cx="90" cy="64" r="2.5" fill="#334155"/>
    <path d="M76 72 q8 8 16 0" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- thumbs up -->
    <path d="M104 96 L122 82" stroke="#10B981" stroke-width="9" stroke-linecap="round"/>
    <rect x="118" y="70" width="14" height="16" rx="5" fill="#FDBA74" stroke="#C2410C" stroke-width="2"/>
    <path d="M124 70 v-10" stroke="#FDBA74" stroke-width="6" stroke-linecap="round"/>
  </g>
  <circle cx="84" cy="28" r="12" fill="#A7F3D0" stroke="#10B981" stroke-width="3"/>
  <path d="M78 28 l4 4 8 -8" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- picky friend: a high bar, needs lots of clues -->
  <rect x="186" y="40" width="100" height="8" rx="4" fill="#F43F5E"/>
  <g>
    <path d="M236 156 v-34" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    <rect x="216" y="84" width="40" height="44" rx="16" fill="#818CF8"/>
    <circle cx="236" cy="66" r="18" fill="#FDBA74" stroke="#C2410C" stroke-width="2"/>
    <path d="M227 62 l6 2 M245 62 l-6 2" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M229 74 h14" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <!-- arms crossed -->
    <path d="M212 102 L252 110 M260 102 L220 110" stroke="#6366F1" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g fill="#C7D2FE"><circle cx="196" cy="70" r="5"/><circle cx="276" cy="70" r="5"/><circle cx="200" cy="120" r="5"/></g>

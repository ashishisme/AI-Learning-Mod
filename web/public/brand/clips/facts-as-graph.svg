<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <style>
    .s { display: none }
    .s:target { display: inline }
    .val { font: 700 17px system-ui, sans-serif; fill: #0F172A; text-anchor: middle }
    .num { font: 700 13px system-ui, sans-serif; fill: #0F172A }
    .arrow { stroke: #334155; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round }
    .pop { transform-box: fill-box; transform-origin: center }
    .s:target .in { animation: show 0.8s ease-out 1 both }
    .s:target .in2 { animation: show 0.8s ease-out 0.5s 1 both }
    .s:target .pop { animation: pop 0.7s ease-out 0.4s 1 both }
    .s:target .pop2 { animation: pop 0.7s ease-out 1.1s 1 both }
    .s:target .fill { animation: rise 1.2s ease-out 0.3s 1 both }
    @keyframes show { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pop { 0% { transform: scale(0.4); opacity: 0 } 70% { transform: scale(1.15); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
    @keyframes rise { from { transform: translateY(40px) } to { transform: none } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <clipPath id="tube"><rect x="205" y="58" width="12" height="52" rx="6"/></clipPath>
    <!-- data: the raw value -->
    <g id="value">
      <rect x="118" y="93" width="56" height="34" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
      <text x="146" y="116" class="val">39.2</text>
    </g>
    <!-- the patient node -->
    <g id="patient">
      <circle cx="44" cy="110" r="24" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
      <circle cx="44" cy="102" r="7" fill="#1D4ED8"/>
      <path d="M31 124 q0 -12 13 -12 q13 0 13 12z" fill="#1D4ED8"/>
    </g>
    <!-- link patient to value, labelled with a thermometer -->
    <g id="link1">
      <path class="arrow" d="M69 110 H113 M106 104 l7 6 l-7 6"/>
      <circle cx="88" cy="110" r="11" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
      <rect x="86" y="101" width="4" height="12" rx="2" fill="#B91C1C"/><circle cx="88" cy="114" r="3.5" fill="#B91C1C"/>
    </g>
    <!-- the fever node -->
    <g id="fever">
      <circle cx="274" cy="110" r="24" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
      <path d="M275 94 c2 7 10 10 10 19 a11 11 0 0 1 -22 0 c0 -6 3 -8 5 -12 c1 4 2 6 4 7 c1 -5 0 -9 3 -14z" fill="#B91C1C"/>
    </g>
    <!-- link value to fever, labelled with a gauge: the line marks 38 -->
    <g id="link2">
      <path class="arrow" d="M174 110 H248 M241 104 l7 6 l-7 6"/>
      <rect x="205" y="58" width="12" height="52" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
      <circle cx="211" cy="112" r="9" fill="#B91C1C"/>
    </g>
    <path id="mark" d="M199 80 H223" stroke="#0F172A" stroke-width="2" stroke-dasharray="3 2"/>
  </defs>
  <rect width="320" height="180" rx="16" fill="#FFFBEB"/>

  <!-- 1: data, a raw value alone -->
  <g id="s1" class="s">
    <g class="pop"><use href="#value"/></g>
  </g>

  <!-- 2: information, the value linked to a patient -->
  <g id="s2" class="s">
    <use href="#value"/>
    <g class="pop"><use href="#patient"/></g>
    <g class="in2"><use href="#link1"/></g>
  </g>

  <!-- 3: knowledge, above 38 means fever -->
  <g id="s3" class="s">
    <use href="#patient"/><use href="#link1"/><use href="#value"/>
    <g class="in"><use href="#link2"/></g>
    <g clip-path="url(#tube)"><rect class="fill" x="205" y="70" width="12" height="42" fill="#B91C1C"/></g>
    <g class="in"><use href="#mark"/><text x="228" y="85" class="num">38</text></g>
    <g class="pop2"><use href="#fever"/></g>
  </g>

  <!-- 4: the network, with a new link straight from patient to fever -->
  <g id="s4" class="s">
    <use href="#patient"/><use href="#link1"/><use href="#value"/><use href="#link2"/>
    <rect x="205" y="70" width="12" height="40" fill="#B91C1C"/>
    <use href="#mark"/><text x="228" y="85" class="num">38</text>
    <use href="#fever"/>
    <g class="in">
      <path class="arrow" d="M52 87 Q160 -12 266 87 M256 84 l10 3 l-1 -10"/>
      <circle cx="159" cy="38" r="11" fill="#047857"/>
      <path d="M154 38 l4 4 l6 -7" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <style>
    .s { display: none }
    .s:target { display: inline }
    .zone { fill: #E0E7FF }
    .cut { stroke: #1D4ED8; stroke-width: 2.5; stroke-dasharray: 5 4; fill: none }
    .num { font: 700 13px system-ui, sans-serif; fill: #0F172A; text-anchor: middle }
    .pill { fill: #FFFFFF; stroke: #475569; stroke-width: 1.5 }
    .best { fill: #DCFCE7; stroke: #047857; stroke-width: 2.5 }
    .ptx { font: 700 14px system-ui, sans-serif; fill: #0F172A; text-anchor: middle }
    .big { font: 700 20px system-ui, sans-serif; fill: #0F172A; text-anchor: middle }
    .ring { fill: none; stroke: #B91C1C; stroke-width: 3; transform-box: fill-box; transform-origin: center }
    .pop { transform-box: fill-box; transform-origin: center }
    .s:target .in { animation: show 0.8s ease-out 1 both }
    .s:target .in2 { animation: show 0.8s ease-out 0.5s 1 both }
    .s:target .ring { animation: pop 0.7s ease-out 0.6s 1 both }
    .s:target .pop { animation: pop 0.6s ease-out 1.1s 1 both }
    .s:target .slideR { animation: slideR 1.4s ease-in-out 1 both }
    .s:target .slideL { animation: slideL 1.4s ease-in-out 1 both }
    @keyframes show { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
    @keyframes pop { 0% { transform: scale(0.4); opacity: 0 } 70% { transform: scale(1.15); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
    @keyframes slideR { from { transform: translateX(-40px) } to { transform: none } }
    @keyframes slideL { from { transform: translateX(40px) } to { transform: none } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <!-- spam (red) sits above the line, genuine (green) below; x = 40 + 40 × phrases -->
    <g id="spam"><rect x="-10" y="-7" width="20" height="14" rx="2" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><path d="M-9 -5 l9 6 l9 -6" stroke="#B91C1C" stroke-width="1.8" fill="none" stroke-linejoin="round"/></g>
    <g id="good"><rect x="-10" y="-7" width="20" height="14" rx="2" fill="#DCFCE7" stroke="#047857" stroke-width="2"/><path d="M-9 -5 l9 6 l9 -6" stroke="#047857" stroke-width="1.8" fill="none" stroke-linejoin="round"/></g>
    <g id="spamNew"><use href="#spam"/><rect x="-13" y="-10" width="26" height="20" rx="4" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="3 2"/></g>
    <g id="goodNew"><use href="#good"/><rect x="-13" y="-10" width="26" height="20" rx="4" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="3 2"/></g>
    <g id="ok"><circle r="9" fill="#047857"/><path d="M-4 0 l3 3 l5 -6" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="no"><circle r="9" fill="#B91C1C"/><path d="M-4 -4 l8 8 M4 -4 l-8 8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/></g>
    <g id="pencil"><path d="M-3 -12 h6 v12 l-3 5 l-3 -5z" fill="#B45309"/><rect x="-3" y="-15" width="6" height="3" fill="#475569"/></g>
    <g id="knob"><circle r="6" fill="#1D4ED8"/></g>
    <g id="axis">
      <path d="M30 108 H292" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <path d="M40 104 v8 M80 104 v8 M120 104 v8 M160 104 v8 M200 104 v8 M240 104 v8 M280 104 v8" stroke="#334155" stroke-width="2"/>
      <text x="40" y="172" class="num">0</text><text x="80" y="172" class="num">1</text><text x="120" y="172" class="num">2</text><text x="160" y="172" class="num">3</text><text x="200" y="172" class="num">4</text><text x="240" y="172" class="num">5</text><text x="280" y="172" class="num">6</text>
    </g>
    <!-- the ten labelled emails: spam 3, 4, 5, 6, 3; not spam 0, 1, 1, 2, 0 -->
    <g id="ten">
      <use href="#spam" x="160" y="90"/><use href="#spam" x="160" y="72"/><use href="#spam" x="200" y="90"/><use href="#spam" x="240" y="90"/><use href="#spam" x="280" y="90"/>
      <use href="#good" x="40" y="126"/><use href="#good" x="40" y="144"/><use href="#good" x="80" y="126"/><use href="#good" x="80" y="144"/><use href="#good" x="120" y="126"/>
    </g>
    <!-- four new emails: spam 3, spam 2, genuine 2, genuine 0 -->
    <g id="four">
      <use href="#spamNew" x="160" y="88"/><use href="#spamNew" x="120" y="88"/>
      <use href="#goodNew" x="120" y="128"/><use href="#goodNew" x="40" y="128"/>
    </g>
    <!-- cut-off at 2 (flag 2 or more) and at 3 -->
    <g id="cut2"><rect class="zone" x="100" y="56" width="196" height="100"/><path class="cut" d="M100 56 V156"/></g>
    <g id="cut3"><rect class="zone" x="140" y="56" width="156" height="100"/><path class="cut" d="M140 56 V156"/></g>
  </defs>
  <rect width="320" height="180" rx="16" fill="#FFFBEB"/>

  <!-- 1: the written rule: flag at 2 or more -->
  <g id="s1" class="s">
    <g class="in"><use href="#cut2"/><use href="#pencil" x="100" y="40"/></g>
    <use href="#axis"/>
  </g>

  <!-- 2: on ten labelled emails it makes 1 mistake -->
  <g id="s2" class="s">
    <use href="#cut2"/><use href="#pencil" x="100" y="40"/>
    <use href="#axis"/>
    <g class="in"><use href="#ten"/></g>
    <circle class="ring" cx="120" cy="126" r="14"/>
    <g class="in2"><rect class="pill" x="12" y="12" width="76" height="28" rx="14"/><text x="50" y="31" class="ptx">2 → 1</text></g>
  </g>

  <!-- 3: try every cut-off: 2 → 1, 3 → 0, 4 → 2; learning picks 3 -->
  <g id="s3" class="s">
    <g class="slideR"><use href="#cut3"/><use href="#knob" x="140" y="50"/></g>
    <use href="#axis"/><use href="#ten"/>
    <rect class="pill" x="12" y="12" width="76" height="28" rx="14"/><text x="50" y="31" class="ptx">2 → 1</text>
    <g class="in"><rect class="best" x="122" y="12" width="76" height="28" rx="14"/><text x="160" y="31" class="ptx">3 → 0</text></g>
    <g class="in2"><rect class="pill" x="224" y="12" width="76" height="28" rx="14"/><text x="262" y="31" class="ptx">4 → 2</text></g>
    <g class="pop"><use href="#ok" x="198" y="14"/></g>
  </g>

  <!-- 4: four new emails: 3 right, the spam with 2 is missed: 75% -->
  <g id="s4" class="s">
    <use href="#cut3"/><use href="#knob" x="140" y="50"/>
    <use href="#axis"/>
    <g class="in"><use href="#four"/></g>
    <circle class="ring" cx="120" cy="88" r="16"/>
    <g class="in2">
      <use href="#ok" x="40" y="26"/><text x="62" y="31" class="ptx">3</text>
      <use href="#no" x="96" y="26"/><text x="118" y="31" class="ptx">1</text>
      <text x="262" y="33" class="big">75%</text>
    </g>
  </g>

  <!-- 5: cut-off back at 2 catches that spam but flags the genuine email with 2 -->
  <g id="s5" class="s">
    <g class="slideL"><use href="#cut2"/><use href="#knob" x="100" y="50"/></g>
    <use href="#axis"/><use href="#four"/>
    <g class="pop"><use href="#ok" x="138" y="74"/></g>
    <circle class="ring" cx="120" cy="128" r="16"/>
  </g>
</svg>

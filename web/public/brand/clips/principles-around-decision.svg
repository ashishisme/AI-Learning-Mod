<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <style>
    .s { display: none }
    .s:target { display: inline }
    .card { fill: #FFFFFF; stroke: #475569; stroke-width: 1.5 }
    .ring { fill: #FFFFFF; stroke: #1D4ED8; stroke-width: 2 }
    .link { stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 4 4; fill: none }
    .arrow { stroke: #334155; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round }
    .pop { transform-box: fill-box; transform-origin: center }
    .s:target .in { animation: show 0.8s ease-out 1 both }
    .s:target .pop { animation: pop 0.6s ease-out 0.2s 1 both }
    .s:target .pop2 { animation-delay: 0.5s }
    .s:target .pop3 { animation-delay: 0.8s }
    .s:target .pop4 { animation-delay: 1.1s }
    .s:target .pop5 { animation-delay: 1.4s }
    .s:target .draw { stroke-dasharray: 90; animation: draw 1s ease-out 0.7s 1 both }
    @keyframes show { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pop { 0% { transform: scale(0.4); opacity: 0 } 70% { transform: scale(1.15); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
    @keyframes draw { from { stroke-dashoffset: 90 } to { stroke-dashoffset: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <!-- the decision: a page with a yes and a no -->
    <g id="decision">
      <rect class="card" x="128" y="68" width="62" height="44" rx="8"/>
      <path d="M137 80 H162 M137 88 H158 M137 96 H162 M137 104 H154" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="178" cy="81" r="7" fill="#047857"/><path d="M174.5 81 l2.5 2.5 l4 -5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="178" cy="99" r="7" fill="#B91C1C"/><path d="M175 96 l6 6 M181 96 l-6 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- five principle icons, centred on 0,0 -->
    <g id="scale" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -11 V10 M-7 10 H7 M-11 -7 H11 M-11 -7 L-15 3 M-11 -7 L-7 3 M11 -7 L7 3 M11 -7 L15 3"/>
      <path d="M-16 3 h10 a5 4 0 0 1 -10 0z M6 3 h10 a5 4 0 0 1 -10 0z" fill="#1D4ED8"/>
    </g>
    <path id="shield" d="M0 -12 L10 -8 V0 q0 8 -10 13 q-10 -5 -10 -13 V-8 z" fill="#1D4ED8"/>
    <g id="lock"><path d="M-6 -2 V-6 a6 6 0 0 1 12 0 V-2" stroke="#1D4ED8" stroke-width="2.5" fill="none"/><rect x="-9" y="-2" width="18" height="13" rx="2" fill="#1D4ED8"/><circle cy="4" r="2" fill="#FFFFFF"/></g>
    <g id="eye"><path d="M-13 0 q13 -12 26 0 q-13 12 -26 0z" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.2"/><circle r="4.5" fill="#1D4ED8"/></g>
    <g id="person" fill="#1D4ED8"><circle cy="-6" r="5"/><path d="M-9 11 a9 8 0 0 1 18 0z"/></g>
    <g id="tick"><circle r="7" fill="#047857"/><path d="M-3.5 0 l2.5 2.5 l4 -5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <!-- dashed links from the decision to each icon -->
    <path id="links" class="link" d="M159 90 L160 30 M159 90 L262 64 M159 90 L232 148 M159 90 L88 148 M159 90 L58 64"/>
    <g id="icon1"><circle class="ring" cx="160" cy="30" r="19"/><use href="#scale" x="160" y="31"/></g>
    <g id="icon2"><circle class="ring" cx="262" cy="64" r="19"/><use href="#shield" x="262" y="64"/></g>
    <g id="icon3"><circle class="ring" cx="232" cy="148" r="19"/><use href="#lock" x="232" y="147"/></g>
    <g id="icon4"><circle class="ring" cx="88" cy="148" r="19"/><use href="#eye" x="88" y="148"/></g>
    <g id="icon5"><circle class="ring" cx="58" cy="64" r="19"/><use href="#person" x="58" y="64"/></g>
    <path id="back" class="arrow" d="M79 57 Q112 46 127 70 M118 66 l9 4 l1 -9"/>
  </defs>
  <rect width="320" height="180" rx="16" fill="#FFFBEB"/>

  <!-- 1: one decision, yes or no -->
  <g id="s1" class="s">
    <g class="in"><use href="#decision"/></g>
  </g>

  <!-- 2: fairness and reliability-safety -->
  <g id="s2" class="s">
    <path class="link" d="M159 90 L160 30 M159 90 L262 64"/>
    <use href="#decision"/>
    <g class="pop"><use href="#icon1"/></g>
    <g class="pop pop2"><use href="#icon2"/></g>
  </g>

  <!-- 3: privacy-security and transparency -->
  <g id="s3" class="s">
    <path class="link" d="M159 90 L160 30 M159 90 L262 64 M159 90 L232 148 M159 90 L88 148"/>
    <use href="#decision"/>
    <use href="#icon1"/><use href="#icon2"/>
    <g class="pop"><use href="#icon3"/></g>
    <g class="pop pop2"><use href="#icon4"/></g>
  </g>

  <!-- 4: accountability, with a way back to challenge and correct -->
  <g id="s4" class="s">
    <use href="#links"/>
    <use href="#decision"/>
    <use href="#icon1"/><use href="#icon2"/><use href="#icon3"/><use href="#icon4"/>
    <g class="pop"><use href="#icon5"/></g>
    <path class="arrow draw" d="M79 57 Q112 46 127 70"/>
    <path class="arrow in" d="M118 66 l9 4 l1 -9"/>
  </g>

  <!-- 5: each principle becomes a check -->
  <g id="s5" class="s">
    <use href="#links"/>
    <use href="#decision"/>
    <use href="#icon1"/><use href="#icon2"/><use href="#icon3"/><use href="#icon4"/><use href="#icon5"/>
    <use href="#back"/>
    <g class="pop"><use href="#tick" x="174" y="16"/></g>
    <g class="pop pop2"><use href="#tick" x="276" y="50"/></g>
    <g class="pop pop3"><use href="#tick" x="246" y="134"/></g>
    <g class="pop pop4"><use href="#tick" x="102" y="134"/></g>
    <g class="pop pop5"><use href="#tick" x="72" y="50"/></g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140" role="img">
  <style>
    .bar { animation: slide 3s ease-in-out infinite; }
    .lamp { animation: lamp 3s ease-in-out infinite; }
    @keyframes slide { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(34px); } }
    @keyframes lamp { 0%, 30%, 100% { opacity: .25; } 45%, 70% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .bar { transform: translateY(34px); } .lamp { opacity: 1; } }
  </style>
  <rect x="2" y="2" width="236" height="136" rx="18" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
  <!-- the total so far, filling a tube -->
  <rect x="62" y="20" width="40" height="104" rx="12" fill="#FFFFFF" stroke="#818CF8" stroke-width="4"/>
  <rect x="68" y="72" width="28" height="46" rx="8" fill="#6366F1"/>
  <!-- level marks on the tube -->
  <g stroke="#C7D2FE" stroke-width="3" stroke-linecap="round">
    <path d="M70 34 h10 M70 50 h10 M70 66 h10 M70 82 h10 M70 98 h10"/>
  </g>
  <!-- clue drops that filled the tube -->
  <g fill="#818CF8" stroke="#6366F1" stroke-width="2">
    <path d="M30 40 q6 9 0 14 q-6 -5 0 -14z"/><path d="M38 70 q6 9 0 14 q-6 -5 0 -14z"/><path d="M30 98 q6 9 0 14 q-6 -5 0 -14z"/>
  </g>
  <path d="M40 56 q10 6 18 10 M46 84 q6 2 12 2 M40 108 q10 -4 18 -6" stroke="#818CF8" stroke-width="2" fill="none" stroke-dasharray="3 4"/>
  <!-- the bias: a bar that sets how high the total must reach -->
  <g class="bar">
    <rect x="48" y="44" width="68" height="8" rx="4" fill="#F43F5E"/>
    <path d="M120 48 l14 -9 v18 z" fill="#F43F5E"/>
  </g>
  <!-- the switch light: on when the total reaches the bar -->
  <rect x="150" y="38" width="64" height="64" rx="16" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="3"/>
  <circle cx="182" cy="70" r="20" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
  <circle class="lamp" cx="182" cy="70" r="20" fill="#10B981" stroke="#059669" stroke-width="3"/>
  <circle class="lamp" cx="176" cy="64" r="6" fill="#A7F3D0"/>
</svg>

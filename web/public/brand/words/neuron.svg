<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140" role="img">
  <style>
    .sig { animation: travel 2.6s ease-in-out infinite; }
    .glow { animation: glow 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(118px); opacity: 0; } }
    @keyframes glow { 0%, 100% { opacity: .55; transform: scale(.92); } 45% { opacity: 1; transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sig { opacity: 1; transform: translateX(60px); } }
  </style>
  <rect x="2" y="2" width="236" height="136" rx="18" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
  <!-- dendrites: the branches that collect clues -->
  <g stroke="#818CF8" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M70 70 L40 40 M52 52 L30 50 M40 40 L28 26 M40 40 L46 22"/>
    <path d="M70 70 L36 74 M48 73 L30 86 M36 74 L20 70"/>
    <path d="M70 70 L44 104 M54 92 L34 100 M44 104 L40 120 M44 104 L26 114"/>
  </g>
  <!-- cell body -->
  <circle class="glow" cx="80" cy="70" r="24" fill="#A7F3D0" stroke="#10B981" stroke-width="4"/>
  <circle cx="80" cy="70" r="9" fill="#059669"/>
  <!-- axon and its ends -->
  <path d="M104 70 C130 62 150 78 176 70 L206 70" stroke="#6366F1" stroke-width="6" stroke-linecap="round" fill="none"/>
  <g fill="#6366F1">
    <circle cx="212" cy="58" r="6"/><circle cx="216" cy="72" r="6"/><circle cx="210" cy="86" r="6"/>
  </g>
  <path d="M206 70 L212 58 M206 70 L216 72 M206 70 L210 86" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  <!-- myelin wraps along the axon -->
  <g fill="#C7D2FE" stroke="#818CF8" stroke-width="2">
    <rect x="116" y="61" width="18" height="12" rx="6" transform="rotate(-12 125 67)"/>
    <rect x="146" y="65" width="18" height="12" rx="6" transform="rotate(10 155 71)"/>
    <rect x="176" y="64" width="18" height="12" rx="6"/>
  </g>
  <!-- clue sparks arriving at the branch tips -->
  <g fill="#FDE68A" stroke="#F59E0B" stroke-width="2">
    <circle cx="28" cy="26" r="4"/><circle cx="46" cy="22" r="4"/><circle cx="20" cy="70" r="4"/><circle cx="26" cy="114" r="4"/>
  </g>
  <!-- the signal travelling down the axon -->
  <circle class="sig" cx="96" cy="70" r="7" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
</svg>

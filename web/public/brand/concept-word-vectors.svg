<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Semantic Embedding Vector Cluster -->
  <rect x="10" y="10" width="80" height="80" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/>
  <!-- Coordinate Axis -->
  <line x1="22" y1="78" x2="78" y2="78" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="78" x2="22" y2="22" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <!-- Fruit Cluster (Apple / Orange) -->
  <circle cx="58" cy="38" r="8" fill="#EF4444"/>
  <circle cx="68" cy="34" r="7" fill="#F97316"/>
  <path d="M 58 38 L 68 34" stroke="#DC2626" stroke-width="2" stroke-dasharray="2 2"/>
  <!-- King / Queen Vector Arrow -->
  <circle cx="36" cy="58" r="7" fill="#3B82F6"/>
  <circle cx="48" cy="52" r="7" fill="#8B5CF6"/>
  <path d="M 36 58 L 48 52" stroke="#2563EB" stroke-width="2" stroke-dasharray="2 2"/>
</svg>
